<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <title>Recherche d'éléments du jeu Satisfactory</title>
    <meta charset="utf-8" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon-js.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <i class="fa-regular fa-folder-open"></i>
      <p>Recherche d'éléments du jeu Satisfactory</p>
      <i class="fa-solid fa-x"></i>
    </header>
    <main>
      <div class="favorite-content">
        <ul>
        </ul>
      </div>
      <hr>
      <div class="search-content">
        <div class="search-box">
          <div class="search-interface-input">
            <div class="search-body">
              <input type="text" name="" id="searchBar" placeholder="Entrez le nom de l'élément que vous rechercher ou la recette">
              <hr>
              <p>FICSIT - Research system v.03818968198615</p>
            </div>
            <button class="search-btn" id="btnSearch">Scan Satisfactory Elements</button>
            <i class="fa-solid fa-thumbtack" id="btnFavorite"></i>
          </div>
        </div>
        <div class="response-search">
          <ul class="search-list" id="searchList" hidden="hidden">
          </ul>
        </div>

      </div>
    </main>
    <!-- Inclusions des scripts JS -->
    <script src="js/modelSatisfactory.js"></script>
    <script src="js/view.js"></script>
    <script src="js/main.js"></script>
    <script src="https://kit.fontawesome.com/4261d5ceb0.js" crossorigin="anonymous"></script>
  </body>
</html>
